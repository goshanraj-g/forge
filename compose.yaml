services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: forgeops
      POSTGRES_USER: forgeops
      POSTGRES_PASSWORD: forgeops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeops"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - forgeops-postgres:/var/lib/postgresql/data

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://forgeops:forgeops@postgres:5432/forgeops
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://forgeops:forgeops@postgres:5432/forgeops
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  forgeops-postgres:
