[project]
name = "forgeops"
version = "0.1.0"
description = "Factory decision intelligence through simulation, optimization, and AI"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "dagster>=1.9",
    "fastapi>=0.115",
    "langfuse>=4.0",
    "numpy>=2.0.2,<2.5",
    "ortools>=9.11",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-ai-slim[openai]>=1.0",
    "sqlmodel>=0.0.22",
    "structlog>=24.4",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplifications
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["backend"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "backend.tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
